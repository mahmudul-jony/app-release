name: Centralized APK Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch to build'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - main
      app:
        description: 'Application identifier'
        required: true
        default: 'onewallet'
        type: choice
        options:
          - onewallet

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------------
  # JOB 1: Reserve Build Number & Version (Globally Serialized Central State Lock)
  # ---------------------------------------------------------------------------------
  reserve-version:
    name: Reserve Build Number (${{ inputs.app }} / ${{ inputs.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: central-version-state-lock
      cancel-in-progress: false
    outputs:
      APP_ID: ${{ steps.reserve.outputs.APP_ID }}
      APP_NAME: ${{ steps.reserve.outputs.APP_NAME }}
      REPOSITORY: ${{ steps.reserve.outputs.REPOSITORY }}
      PACKAGE_NAME: ${{ steps.reserve.outputs.PACKAGE_NAME }}
      VERSION_NAME: ${{ steps.reserve.outputs.VERSION_NAME }}
      BUILD_NUMBER: ${{ steps.reserve.outputs.BUILD_NUMBER }}
      VERSION_CODE: ${{ steps.reserve.outputs.VERSION_CODE }}
      VERSION_FULL: ${{ steps.reserve.outputs.VERSION_FULL }}
      CHANNEL: ${{ steps.reserve.outputs.CHANNEL }}
      IS_PRERELEASE: ${{ steps.reserve.outputs.IS_PRERELEASE }}
      RELEASE_TAG: ${{ steps.reserve.outputs.RELEASE_TAG }}
      RELEASE_TITLE: ${{ steps.reserve.outputs.RELEASE_TITLE }}
      APK_ASSET_NAME: ${{ steps.reserve.outputs.APK_ASSET_NAME }}
      METADATA_ASSET_NAME: ${{ steps.reserve.outputs.METADATA_ASSET_NAME }}
      RESERVATION_ID: ${{ steps.reserve.outputs.RESERVATION_ID }}
      FLUTTER_VERSION: ${{ steps.reserve.outputs.FLUTTER_VERSION }}
      FLUTTER_CHANNEL: ${{ steps.reserve.outputs.FLUTTER_CHANNEL }}
      JAVA_VERSION: ${{ steps.reserve.outputs.JAVA_VERSION }}
      SOURCE_BRANCH: ${{ steps.reserve.outputs.SOURCE_BRANCH }}

    steps:
      - name: Checkout central release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required secrets before reservation
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$SOURCE_REPO_TOKEN" ]] && missing+=("SOURCE_REPO_TOKEN")
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=("ANDROID_KEY_PASSWORD")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Required secrets missing in app-release. Failing before reserving build number:"
            for sec in "${missing[@]}"; do
              echo "  - $sec"
            done
            exit 1
          fi
          echo "All required secrets verified."

      - name: Fetch target branch pubspec.yaml from source repository
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching target branch pubspec.yaml for ${{ inputs.app }} (${{ inputs.branch }})..."
          REPO_NAME=$(python -c "import json; data=json.load(open('version-state.json')); print(data.get('apps', {}).get('${{ inputs.app }}', {}).get('repository', 'mahmudul-jony/Onewallet'))")
          echo "Target repository: $REPO_NAME, branch: ${{ inputs.branch }}"

          TEMP_PUBSPEC="$RUNNER_TEMP/source_pubspec.yaml"
          rm -f "$TEMP_PUBSPEC"

          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$TEMP_PUBSPEC" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "User-Agent: app-release-workflow" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$REPO_NAME/contents/pubspec.yaml?ref=${{ inputs.branch }}")

          if [ "$HTTP_STATUS" -eq 200 ] && [ -s "$TEMP_PUBSPEC" ]; then
            echo "Successfully fetched source pubspec.yaml (HTTP 200)."
            grep -E "^version:" "$TEMP_PUBSPEC" || true
            echo "SOURCE_PUBSPEC_ARG=--source-pubspec $TEMP_PUBSPEC" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not fetch pubspec.yaml via curl (HTTP $HTTP_STATUS). Relying on central state / Python fallback."
            echo "SOURCE_PUBSPEC_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Atomically reserve and persist build number
        id: reserve
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS to reserve and push version state..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Run reservation script which updates version-state.json and exports outputs
            python scripts/manage_version.py reserve \
              --app "${{ inputs.app }}" \
              --branch "${{ inputs.branch }}" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --state-file "version-state.json" \
              $SOURCE_PUBSPEC_ARG

            git add version-state.json

            if git diff --staged --quiet; then
              echo "Reservation already recorded for this run_id."
              break
            fi

            git commit -m "chore(version): reserve ${{ inputs.app }} build [skip ci]"

            if git push origin main; then
              echo "Reservation successfully committed and pushed to origin main."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to push version reservation after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            JITTER=$(( (RANDOM % 3) + 2 ))
            echo "Push conflict, retrying reservation in $JITTER seconds..."
            sleep $JITTER
          done

  # ---------------------------------------------------------------------------------
  # JOB 2: Build APK & Publish Release (App-Specific Concurrency)
  # ---------------------------------------------------------------------------------
  build-and-release:
    name: Build & Publish APK (${{ inputs.app }} / ${{ inputs.branch }})
    needs: reserve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-${{ inputs.app }}
      cancel-in-progress: false
    outputs:
      COMMIT_SHA: ${{ steps.source_meta.outputs.COMMIT_SHA }}

    steps:
      - name: Checkout central release repository (tools & scripts)
        uses: actions/checkout@v4
        with:
          path: central-repo
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout source application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.reserve-version.outputs.REPOSITORY }}
          ref: ${{ needs.reserve-version.outputs.SOURCE_BRANCH }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source-repo
          fetch-depth: 1

      - name: Record source commit metadata
        id: source_meta
        working-directory: source-repo
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIMESTAMP=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "Source Repository : ${{ needs.reserve-version.outputs.REPOSITORY }}"
          echo "Selected Branch   : ${{ needs.reserve-version.outputs.SOURCE_BRANCH }}"
          echo "Release Channel   : ${{ needs.reserve-version.outputs.CHANNEL }}"
          echo "Source Commit SHA : $COMMIT_SHA"
          echo "Build Timestamp   : $BUILD_TIME"

      - name: Apply reserved version to source pubspec.yaml (runner memory only)
        run: |
          python central-repo/scripts/manage_version.py apply-to-source \
            --source-dir source-repo \
            --version-name "${{ needs.reserve-version.outputs.VERSION_NAME }}" \
            --build-number "${{ needs.reserve-version.outputs.BUILD_NUMBER }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.reserve-version.outputs.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.reserve-version.outputs.FLUTTER_VERSION }}
          channel: ${{ needs.reserve-version.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure Android local.properties
        working-directory: source-repo
        shell: bash
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "Configured android/local.properties with flutter.sdk=$FLUTTER_ROOT"

      - name: Setup Android release signing
        working-directory: source-repo
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          # Decode keystore file into onewallet-keystore.jks and upload-keystore.jks for universal compatibility
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/onewallet-keystore.jks
          cp android/app/onewallet-keystore.jks android/onewallet-keystore.jks
          cp android/app/onewallet-keystore.jks android/app/upload-keystore.jks
          cp android/app/onewallet-keystore.jks android/upload-keystore.jks

          KEY_ALIAS="${ANDROID_KEY_ALIAS:-onewallet}"

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=onewallet-keystore.jks
          EOF

          echo "Android release signing configured with key alias: $KEY_ALIAS"

      - name: Install Flutter dependencies
        working-directory: source-repo
        run: flutter pub get

      - name: Generate app icons (if configured)
        working-directory: source-repo
        shell: bash
        run: |
          if grep -q "flutter_launcher_icons:" pubspec.yaml; then
            echo "Running flutter_launcher_icons..."
            dart run flutter_launcher_icons || echo "Warning: Icon generation exited with non-zero, continuing."
          else
            echo "flutter_launcher_icons not found in pubspec.yaml, skipping."
          fi

      - name: Build signed release APK
        working-directory: source-repo
        shell: bash
        env:
          VERSION_NAME: ${{ needs.reserve-version.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ needs.reserve-version.outputs.BUILD_NUMBER }}
        run: |
          set -euo pipefail
          echo "Building signed release APK..."
          echo "  versionName : $VERSION_NAME"
          echo "  versionCode : $BUILD_NUMBER"

          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if flutter build apk --release \
                --build-name="$VERSION_NAME" \
                --build-number="$BUILD_NUMBER"; then
              echo "APK build successful on attempt $attempt."
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Flutter APK build failed after 3 attempts."
              exit 1
            fi

            echo "Build failed. Retrying in 20 seconds..."
            sleep 20
          done

      - name: Validate release APK and prepare assets
        shell: bash
        env:
          EXPECTED_PACKAGE_NAME: ${{ needs.reserve-version.outputs.PACKAGE_NAME }}
          APK_PATH: "source-repo/build/app/outputs/flutter-apk/app-release.apk"
          ASSET_NAME: ${{ needs.reserve-version.outputs.APK_ASSET_NAME }}
          METADATA_NAME: ${{ needs.reserve-version.outputs.METADATA_ASSET_NAME }}
        run: |
          set -euo pipefail
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK file not found at $APK_PATH"
            exit 1
          fi

          echo "APK file confirmed: $(ls -lh "$APK_PATH" | awk '{print $5}')"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path not found in environment."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          if [[ -z "$APKSIGNER" || -z "$AAPT" ]]; then
            echo "::error::apksigner or aapt tools not found in Android SDK ($SDK_ROOT/build-tools)"
            exit 1
          fi

          echo "Using apksigner : $APKSIGNER"
          echo "Using aapt      : $AAPT"

          echo "--- 1. Verifying APK Signature ---"
          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "--- 2. Inspecting APK Badging & Package Name ---"
          BADGING="$("$AAPT" dump badging "$APK_PATH")"

          if [[ -n "$EXPECTED_PACKAGE_NAME" ]]; then
            if ! grep -Fq "package: name='$EXPECTED_PACKAGE_NAME'" <<< "$BADGING"; then
              echo "::error::APK package identifier does not match expected '$EXPECTED_PACKAGE_NAME'"
              exit 1
            fi
            echo "APK package identifier successfully verified: $EXPECTED_PACKAGE_NAME"
          fi

          echo "$BADGING" | grep "package: name="

          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/$ASSET_NAME"
          (cd release-assets && sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256")

          # Generate public release-metadata.json
          python central-repo/scripts/manage_version.py generate-metadata \
            --app "${{ needs.reserve-version.outputs.APP_ID }}" \
            --app-name "${{ needs.reserve-version.outputs.APP_NAME }}" \
            --package-name "${{ needs.reserve-version.outputs.PACKAGE_NAME }}" \
            --version-name "${{ needs.reserve-version.outputs.VERSION_NAME }}" \
            --build-number "${{ needs.reserve-version.outputs.BUILD_NUMBER }}" \
            --branch "${{ needs.reserve-version.outputs.SOURCE_BRANCH }}" \
            --commit-sha "${{ steps.source_meta.outputs.COMMIT_SHA }}" \
            --release-tag "${{ needs.reserve-version.outputs.RELEASE_TAG }}" \
            --release-title "${{ needs.reserve-version.outputs.RELEASE_TITLE }}" \
            --apk-asset-name "${{ needs.reserve-version.outputs.APK_ASSET_NAME }}" \
            --apk-path "release-assets/$ASSET_NAME" \
            --output-file "release-assets/$METADATA_NAME"

          echo "Prepared release assets in release-assets/:"
          ls -lh release-assets/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.reserve-version.outputs.APK_ASSET_NAME }}
          path: release-assets/
          retention-days: 14
          if-no-files-found: error

      - name: Generate release notes
        shell: bash
        env:
          APP_ID: ${{ needs.reserve-version.outputs.APP_ID }}
          APP_NAME: ${{ needs.reserve-version.outputs.APP_NAME }}
          VERSION_NAME: ${{ needs.reserve-version.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ needs.reserve-version.outputs.BUILD_NUMBER }}
          CHANNEL: ${{ needs.reserve-version.outputs.CHANNEL }}
          SOURCE_BRANCH: ${{ needs.reserve-version.outputs.SOURCE_BRANCH }}
          SOURCE_COMMIT: ${{ steps.source_meta.outputs.COMMIT_SHA }}
          BUILD_TIMESTAMP: ${{ steps.source_meta.outputs.BUILD_TIMESTAMP }}
          ASSET_NAME: ${{ needs.reserve-version.outputs.APK_ASSET_NAME }}
          METADATA_NAME: ${{ needs.reserve-version.outputs.METADATA_ASSET_NAME }}
          PACKAGE_NAME: ${{ needs.reserve-version.outputs.PACKAGE_NAME }}
          REPOSITORY: ${{ needs.reserve-version.outputs.REPOSITORY }}
          RELEASE_TAG: ${{ needs.reserve-version.outputs.RELEASE_TAG }}
        run: |
          cat > release-notes.md <<EOF
          # $APP_NAME Release v${VERSION_NAME}+${BUILD_NUMBER} (${CHANNEL^} Channel)

          Automated release built centrally by [app-release](https://github.com/${{ github.repository }}).

          ## Release Identification
          - **Application Identifier:** \`$APP_ID\`
          - **Application Name:** $APP_NAME
          - **Package Identifier:** \`$PACKAGE_NAME\`
          - **Release Channel:** \`$CHANNEL\` (Source branch: \`$SOURCE_BRANCH\`)
          - **Version Name:** \`$VERSION_NAME\`
          - **Build Number (versionCode):** \`$BUILD_NUMBER\`
          - **Release Tag:** \`$RELEASE_TAG\`
          - **Source Repository:** [\`$REPOSITORY\`](https://github.com/$REPOSITORY)
          - **Source Commit SHA:** [\`${SOURCE_COMMIT:0:7}\`](https://github.com/$REPOSITORY/commit/$SOURCE_COMMIT) (\`$SOURCE_COMMIT\`)
          - **Build Timestamp:** \`$BUILD_TIMESTAMP\`

          ## Public Download Assets
          - **Direct APK Download:** [\`$ASSET_NAME\`](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$ASSET_NAME)
          - **SHA-256 Checksum:** [\`${ASSET_NAME}.sha256\`](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/${ASSET_NAME}.sha256)
          - **Machine-Readable Metadata:** [\`$METADATA_NAME\`](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$METADATA_NAME)

          *Note: This repository is public. All release assets and metadata can be downloaded directly without authentication.*
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.reserve-version.outputs.RELEASE_TAG }}
          TITLE: ${{ needs.reserve-version.outputs.RELEASE_TITLE }}
          IS_PRERELEASE: ${{ needs.reserve-version.outputs.IS_PRERELEASE }}
        run: |
          set -euo pipefail

          # Ensure git context points to central-repo
          git config --global --add safe.directory "$GITHUB_WORKSPACE/central-repo" || true
          export GIT_DIR="$GITHUB_WORKSPACE/central-repo/.git"
          export GIT_WORK_TREE="$GITHUB_WORKSPACE/central-repo"

          TARGET_COMMIT="$(git -C central-repo rev-parse HEAD || echo "main")"
          echo "Publishing release to $GH_REPO under tag $TAG (target: $TARGET_COMMIT, prerelease: $IS_PRERELEASE)..."

          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating assets..."
            gh release upload "$TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            echo "Creating new GitHub Release: $TAG..."
            gh release create "$TAG" release-assets/* \
              --repo "$GH_REPO" \
              --target "$TARGET_COMMIT" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
          echo "Release successfully published."

  # ---------------------------------------------------------------------------------
  # JOB 3: Finalize Central Version State (Globally Serialized Central State Lock)
  # ---------------------------------------------------------------------------------
  finalize-state:
    name: Finalize Version State
    needs: [reserve-version, build-and-release]
    if: always() && needs.reserve-version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: central-version-state-lock
      cancel-in-progress: false

    steps:
      - name: Checkout central release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Finalize successful release state
        if: needs.build-and-release.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS to finalize successful release..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            python scripts/manage_version.py finalize-release \
              --app "${{ needs.reserve-version.outputs.APP_ID }}" \
              --build-number "${{ needs.reserve-version.outputs.BUILD_NUMBER }}" \
              --run-id "${{ github.run_id }}" \
              --commit-sha "${{ needs.build-and-release.outputs.COMMIT_SHA }}" \
              --state-file "version-state.json"

            git add version-state.json

            if git diff --staged --quiet; then
              echo "No state changes to commit."
              break
            fi

            git commit -m "chore(release): finalize ${{ needs.reserve-version.outputs.APP_NAME }} v${{ needs.reserve-version.outputs.VERSION_FULL }} [skip ci]"

            if git push origin main; then
              echo "Release finalized and state successfully pushed."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to push release finalization after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            JITTER=$(( (RANDOM % 3) + 2 ))
            echo "Push conflict, retrying finalization in $JITTER seconds..."
            sleep $JITTER
          done

      - name: Record failure or cancellation in central state
        if: needs.build-and-release.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS to record failure state..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            python scripts/manage_version.py record-failure \
              --app "${{ needs.reserve-version.outputs.APP_ID }}" \
              --build-number "${{ needs.reserve-version.outputs.BUILD_NUMBER }}" \
              --run-id "${{ github.run_id }}" \
              --reason "${{ needs.build-and-release.result }}" \
              --commit-sha "${{ needs.build-and-release.outputs.COMMIT_SHA }}" \
              --state-file "version-state.json"

            git add version-state.json

            if git diff --staged --quiet; then
              echo "No state changes to commit."
              break
            fi

            git commit -m "chore(version): record ${{ needs.reserve-version.outputs.APP_ID }} build ${{ needs.reserve-version.outputs.BUILD_NUMBER }} ${{ needs.build-and-release.result }} [skip ci]"

            if git push origin main; then
              echo "Failure recorded and state pushed."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::warning::Failed to record failure state after $MAX_ATTEMPTS attempts."
              break
            fi

            JITTER=$(( (RANDOM % 3) + 2 ))
            echo "Push conflict, retrying failure record in $JITTER seconds..."
            sleep $JITTER
          done

          # Re-fail job so overall workflow displays failure status
          echo "::error::Build job failed with status: ${{ needs.build-and-release.result }}"
          exit 1
